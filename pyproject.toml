# Описание проекта и настройки инструментов.

[project]
name = "partut"
version = "1.0.0"
description = "ParTuT — магазин в Telegram: бот и мини-приложение к нему"
requires-python = ">=3.11"
# Зависимости намеренно НЕ здесь, а в requirements.txt с точными версиями:
# хостинг ставит именно его, и второй список неизбежно разошёлся бы с первым.
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["partut*"]

# Настройки линтера. Правила выбраны по одному признаку: находят ОШИБКИ, а не
# несогласия о стиле.
#
#   F  — неиспользуемые импорты и переменные, обращения к несуществующим именам.
#        Ровно этим он нашёл `import datetime`, осиротевший после правки часовых
#        поясов, и три импорта, оставшихся от давно переписанного кода.
#   E9 — синтаксис и то, что упадёт при запуске.
#
# Осознанно НЕ включены наборы про стиль (SIM, UP, RET и прочие): на этом коде
# они дают 37 замечаний, ни одно из которых не ошибка. Линтер, который заставляет
# править работающий код, перестают читать — и он перестаёт находить настоящее.
[tool.ruff]
line-length = 120          # в проекте длинные строки с SQL и текстами для людей
target-version = "py311"   # та же, что в CI и на хостинге (.python-version)

[tool.ruff.lint]
select = ["F", "E9"]
