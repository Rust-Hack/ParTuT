# Настройки сервиса для Render (можно подключить как Blueprint).
# Секретные значения (BOT_TOKEN, DATABASE_URL и т.д.) вписываются в панели Render,
# а не сюда — поэтому sync: false.
services:
  - type: web
    name: vape-app
    runtime: python
    plan: free
    # Версия питона — в .python-version (3.11), там же, что и в прогоне
    # GitHub: проверки обязаны идти на том языке, на котором работает магазин.
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      # Что делает процесс: all (бот и сайт вместе), web или bot.
      # Сейчас all — бесплатный тариф даёт один процесс, и падение одного
      # роняет оба, а выкатка означает простой всего магазина. Разнести их
      # правильно: завести второй сервис типа worker с ROLE=bot, а этому
      # поставить ROLE=web. Второй процесс на Render платный — отсюда и «пока».
      - key: ROLE
        value: all
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_IDS
        sync: false
      # Владелец магазина: ему видны «Журнал действий», «Доступ продавцов» и
      # запросы на подтверждение операций с монетами. Без этой переменной
      # владельцем считается только зашитый в код id.
      - key: SUPER_ADMIN_IDS
        sync: false
      # Разработчик: техническое поверх владельца (отчёты о сбоях, сброс
      # статистики). Раньше его номер был вшит в config.py, то есть отозвать
      # доступ можно было только правкой кода. Пусто — сбои идут владельцу.
      - key: DEV_IDS
        sync: false
      # Кому идут вопросы из «Написать в поддержку». Пусто — владельцу.
      - key: SUPPORT_IDS
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: ADMIN_MINSK
        sync: false
      - key: ADMIN_SLUTSK
        sync: false
      - key: ADMIN_TUROV
        sync: false
      # Вторая копия базы — вне Телеграма. Ежедневная копия уходит владельцу в
      # тот же аккаунт, которым он открывает магазин и в котором лежит токен
      # бота: потеря доступа отняла бы разом и управление, и все копии.
      # Подходит любой WebDAV (Яндекс.Диск, Nextcloud) или S3-совместимое
      # хранилище. Пароль — приложения, НЕ основной от аккаунта.
      - key: BACKUP_URL
        sync: false
      - key: BACKUP_USER
        sync: false
      - key: BACKUP_PASSWORD
        sync: false
