# Настройки сервиса для Render (можно подключить как Blueprint).
# Секретные значения (BOT_TOKEN, DATABASE_URL и т.д.) вписываются в панели Render,
# а не сюда — поэтому sync: false.
services:
  - type: web
    name: vape-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: ADMIN_MINSK
        sync: false
      - key: ADMIN_SLUTSK
        sync: false
      - key: ADMIN_TUROV
        sync: false
